[package]
name = "artef"
version = "0.1.0"
edition = "2021"
description = "CLI for artef — push agent-generated HTML documents to an artef server"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.9"
hex = "0.4.3"
lol_html = "2"
rand = "0.10.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "process"] }
toml = "1.1.4"
url = "2.5.8"
webbrowser = "1.2.4"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
