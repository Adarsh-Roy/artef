# artef — three services on one domain (spec §10):
#
#   caddy       TLS for a single host, reverse-proxies to the app
#   app         Node — API, auth, ACL, viewer shell, sandboxed content, assets
#   postgres    metadata, ACL, and blobs
#
# No Redis (Postgres LISTEN/NOTIFY replaces it), no oauth2-proxy, no second
# origin. Two services fewer than a standard Outline deployment.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    # Published release image (built by .github/workflows/release.yml from the
    # repo Dockerfile). For a source deploy, comment `image:` and uncomment:
    # build: .
    image: ghcr.io/adarsh-roy/artef:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      # DATABASE_URL defaults to the bundled postgres, so out of the box the
      # operator never hand-writes a connection string. But if they set
      # DATABASE_URL in .env (a managed database), that value is honored —
      # Outline muscle memory (spec §10). PORT is fixed to match the image and
      # the Caddyfile upstream.
      DATABASE_URL: "${DATABASE_URL:-postgres://artef:${POSTGRES_PASSWORD:-artef}@postgres:5432/artef}"
      PORT: "3000"
    # Uncomment to reach the app directly, without Caddy, for local testing:
    # ports:
    #   - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: artef
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-artef}"
      POSTGRES_DB: artef
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artef -d artef"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  pg_data:
